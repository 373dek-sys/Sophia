name: Stock Screener Automation

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write  # リポジトリへの書き込み権限を許可

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests openpyxl lxml html5lib xlrd

      - name: Run scripts
        run: |
          python us_sp500.py
          python us_nasdaq.py
          python jp_stock.py

      - name: Commit and push generated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.csv
          # 変更がある場合のみコミット＆プッシュ
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update screening CSV results [skip ci]" && git push)
