name: Stock Screener Automation

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests openpyxl lxml html5lib xlrd

      - name: Run scripts
        run: |
          python us_sp500.py
          python us_nasdaq.py
          python jp_stock.py

      - name: Upload CSV results as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-screener-results
          path: |
            *.csv
