name: Stock Screener Automation & Commit

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests openpyxl lxml html5lib xlrd

      - name: Run scripts
        run: |
          python us_sp500.py
          python us_nasdaq.py
          python jp_stock.py

      - name: Commit and push CSV results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          
          # 変更状況を確認してCSVを強制追加
          git add -f *.csv
          
          # 変更がある場合のみコミット＆プッシュを実行
          git diff --staged --quiet || (git commit -m "Auto-update screening CSV results" && git push)
