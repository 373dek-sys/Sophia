<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>株価スクリーニング結果ビューア</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen p-4 sm:p-6">
    <div class="max-w-7xl mx-auto">
        <header class="mb-6 text-center">
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900">株価スクリーニング結果ビューア</h1>
            <p class="text-sm text-gray-600 mt-1">GitHub上の最新データを自動取得して表示します</p>
        </header>

        <!-- ファイル切り替え・読み込みコントロール -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 mb-6 flex flex-wrap items-center gap-4">
            <label for="csvSelect" class="font-medium text-sm">読み込むファイル:</label>
            <select id="csvSelect" class="border border-gray-300 rounded-lg px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <!-- 必要に応じてGitHubにあるCSVファイル名に変更してください -->
                <option value="swing_candidates_SP500.csv">S&amp;P 500 (SP500)</option>
                <option value="swing_candidates_NASDAQ.csv">NASDAQ</option>
                <option value="swing_candidates_JP.csv">日本株 (JP)</option>
            </select>
            <button id="loadBtn" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg transition-colors">
                データを読み込む
            </button>
        </div>

        <!-- テーブル表示エリア -->
        <div id="tableContainer" class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <div class="p-8 text-center text-gray-500" id="message">
                上の「データを読み込む」ボタンを押してください。
            </div>
        </div>
    </div>

    <script>
        // ご自身のGitHubアカウント名とリポジトリ名に合わせて変更してください
        const GITHUB_USER = "373dek-sys";
        const REPO_NAME = "sophia";
        const BRANCH = "main";

        document.getElementById('loadBtn').addEventListener('click', () => {
            const fileName = document.getElementById('csvSelect').value;
            // GitHubのRaw URL（直接ファイルの中身を取得するURL）
            const url = `https://raw.githubusercontent.com/${GITHUB_USER}/${REPO_NAME}/${BRANCH}/${fileName}`;

            const container = document.getElementById('tableContainer');
            container.innerHTML = `<div class="p-8 text-center text-gray-500">読み込み中...</div>`;

            Papa.parse(url, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    displayTable(results.data);
                },
                error: function(err) {
                    container.innerHTML = `<div class="p-8 text-center text-red-500">ファイルの読み込みに失敗しました。<br>ファイル名やリポジトリにCSVが存在するか確認してください。<br><small>${err.message}</small></div>`;
                }
            });
        });

        function displayTable(data) {
            const container = document.getElementById('tableContainer');
            if (!data || data.length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-gray-500">データが空です。</div>`;
                return;
            }

            const headers = Object.keys(data[0]);

            let html = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse text-sm"><thead class="bg-gray-100 text-gray-700 uppercase text-xs"><tr>';
            headers.forEach(header => {
                html += `<th class="px-4 py-3 border-b border-gray-200 whitespace-nowrap">${header}</th>`;
            });
            html += '</tr></thead><tbody class="divide-y divide-gray-200">';

            data.forEach(row => {
                html += '<tr class="hover:bg-gray-50 transition-colors">';
                headers.forEach(header => {
                    html += `<td class="px-4 py-3 whitespace-nowrap text-gray-700">${row[header] !== undefined ? row[header] : ''}</td>`;
                });
                html += '</tr>';
            });

            html += '</tbody></table></div>';
            container.innerHTML = html;
        }
    </script>
</body>
</html>
